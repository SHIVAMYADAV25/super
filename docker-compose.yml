version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: super-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: superhuman

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d superhuman"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: